name: Release

# Push a tag like v0.2.0 to build a universal DMG and publish it as a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release notes need the earlier tags and commits
      - run: swift test
      - name: Build Notchi.dmg
        run: UNIVERSAL=1 VERSION="${GITHUB_REF_NAME#v}" ./scripts/make-app.sh && ./scripts/make-dmg.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release-notes.sh "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" build/Notchi.dmg \
            --title "Notchi $GITHUB_REF_NAME" --notes-file notes.md
