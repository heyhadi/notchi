<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["bolt","mochi","goo","boo","tofu","sprout","ember","nimbus","inky","bun","byte","quack"],"default":"bolt"},"size":{"editor":"int","min":16,"max":400,"default":200},"$preview":{"width":200,"height":200}}'>

renderVals() {
const k = this.props.kind ?? 'bolt';
const is = {};
['bolt','mochi','goo','boo','tofu','sprout','ember','nimbus','inky','bun','byte','quack'].forEach((n) => { is[n] = n === k; });
return { size: this.props.size ?? 200, is };
}
}
</script>
